# Inventory Service — single configuration source (T003; replaces application.properties).
# Bindings follow contracts/asyncapi.yaml; retry/DLQ follows clarified FR-006
# (3 retries with exponential backoff, then DLQ preserving the orderId header).
spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/inventory}
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    function:
      definition: reserveStockConsumer
    stream:
      bindings:
        reserveStockConsumer-in-0:
          destination: inventory.reservation.requests
          group: inventory-service
          consumer:
            maxAttempts: 4
            backOffInitialInterval: 1000
            backOffMultiplier: 2.0
            backOffMaxInterval: 10000
        reserveOutcome-out-0:
          destination: inventory.reservation.decisions
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          auto-create-topics: true
        bindings:
          reserveStockConsumer-in-0:
            consumer:
              enableDlq: true
              dlqName: inventory.reservation.requests.dlq
              dlqPartitions: 1
